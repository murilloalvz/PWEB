<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Murillo Alves Lourenço">
    <meta name="description" content="Pesquisa de opinião sobre o lançamento de um filme">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
    <title>Pesquisa do Filme</title>
</head>
<body>
    <div class="topo">
        <h1>Pesquisa - Lançamento do Filme</h1>
        <p>Responda a pesquisa na saída da sessão</p>
    </div>

    <div class="container">
        <div class="cartao">
            <h2>Dados do espectador</h2>
            <p>Respostas registradas: <strong><span id="contador">0</span> de 45</strong></p>

            <label for="idade">Idade:</label>
            <input type="number" id="idade" min="1" max="120">

            <label for="sexo">Sexo:</label>
            <select id="sexo">
                <option value="">Selecione</option>
                <option value="F">Feminino</option>
                <option value="M">Masculino</option>
                <option value="O">Outros</option>
            </select>

            <label for="opiniao">Opinião sobre o filme:</label>
            <select id="opiniao">
                <option value="">Selecione</option>
                <option value="4">Ótimo</option>
                <option value="3">Bom</option>
                <option value="2">Regular</option>
                <option value="1">Péssimo</option>
            </select>

            <button type="button" id="btnRegistrar" onclick="registrar()">Registrar resposta</button>
            <button type="button" class="secundario" onclick="mostrarResultados()">Ver resultado parcial</button>
            <p id="mensagem"></p>
        </div>

        <div class="cartao">
            <h2>Resultados</h2>
            <div id="resultados">
                <p>Nenhuma resposta registrada ainda.</p>
            </div>
        </div>
    </div>

    <div class="rodape">
        <p>Atividade 8 - Programação Web</p>
        <p>Murillo Alves Lourenço</p>
    </div>
</body>
</html>
